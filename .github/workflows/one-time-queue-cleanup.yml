name: One-time queued run cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-queue-cleanup.yml'

permissions:
  actions: write

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only the verified documentation and landing-page runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 41594441437 41594441426 41594016318 41594009111 41594002363 41593997395 41593988827 41593981358 41593974482 41592071622 41591429559 41591422599 41591415750 41591408992 41591403359 41591397635 41591392174; do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status')"
            if [[ "${status}" == "queued" || "${status}" == "in_progress" ]]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null
              echo "Cancellation requested for ${run_id} (${status})"
            else
              echo "Skipping ${run_id}; current status is ${status}"
            fi
          done
