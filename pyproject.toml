[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qoralis-engine"
dynamic = ["version"]
description = "Qoralis Engine: hardware-aware local inference for large open models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Qoralis contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
convert = [
    "numpy",
    "huggingface_hub",
]
oracle = [
    "torch>=2.0",
    "transformers>=4.40",
    "safetensors",
]
bench = [
    "tokenizers",
    "datasets",
]
vision = [   # pictures through the gateway (the towers' preprocessors)
    "numpy",
    "pillow",
]

[project.scripts]
qoralis = "colibri.cli:main"
coli = "colibri.cli:main"  # Backward-compatible alias

[project.urls]
Homepage = "https://github.com/anku0669/qoralis-engine"
Issues = "https://github.com/anku0669/qoralis-engine/issues"

[tool.setuptools.dynamic]
version = {attr = "colibri._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["colibri*"]
